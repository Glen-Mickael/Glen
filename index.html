<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#203a5d">
<title>GLEN</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f6f8;color:#18212b}
header{background:#203a5d;color:white;padding:28px 22px 24px}header h1{margin:0;font-size:34px}header p{margin:6px 0 0;opacity:.85}
main{max-width:900px;margin:22px auto;padding:0 16px}.card{background:white;border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px #0000000c}
h2{margin-top:0}.btn{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#2375b9;color:#fff}.btn.secondary{background:#e8eef4;color:#203a5d}.btn.danger{background:#b93838}.btn:disabled{opacity:.5}
input{width:100%;padding:13px;border:1px solid #cbd5df;border-radius:10px;font-size:16px;margin:6px 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.small{color:#66727e}.error{color:#b42318;margin-top:8px}.ok{color:#18794e;margin-top:8px}
.item{border:1px solid #dce3e9;border-radius:14px;padding:15px;margin:10px 0}.item h3{margin:0 0 5px}.item p{margin:4px 0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e9f1f8;color:#203a5d;font-size:13px;font-weight:700}
.hidden{display:none!important}
label{font-weight:600}
hr{border:0;border-top:1px solid #e2e7eb;margin:20px 0}
#app{min-height:70vh}
</style>
</head>
<body>
<header><h1>GLEN</h1><p>Gestion des chantiers et logements</p></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* REMPLACER CES DEUX VALEURS PAR CELLES DE TON PROJET SUPABASE */
const SUPABASE_URL = "https://vmhqbywplgahrxozroit.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_KQHZK6sX5B4OHDo7UYHu1Q_iKsKsSf2";

const app = document.getElementById("app");
let supabaseClient = null, currentProfile = null;

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function set(msg, cls=""){app.innerHTML=`<div class="card ${cls}">${msg}</div>`;}

function configOK(){
  return SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("A_REMPLACER") &&
         SUPABASE_PUBLISHABLE_KEY && !SUPABASE_PUBLISHABLE_KEY.includes("A_REMPLACER");
}

async function init(){
  if(!configOK()){
    set(`<h2>GLEN V2 — configuration</h2>
    <p>La base de données n'est pas encore connectée.</p>
    <p class="small">Après création du projet Supabase, remplace les deux valeurs indiquées dans le fichier index.html.</p>`);
    return;
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const {data:{session}} = await supabaseClient.auth.getSession();
  if(session) await loadProfile();
  else loginView();
}

function loginView(){
  app.innerHTML=`<div class="card">
    <h2>Connexion</h2>
    <label>Email</label><input id="email" type="email" autocomplete="username">
    <label>Mot de passe</label><input id="password" type="password" autocomplete="current-password">
    <button class="btn" onclick="login()">Se connecter</button>
    <div id="msg"></div>
  </div>`;
}
async function login(){
  const msg=document.getElementById("msg");
  msg.className="";
  const {error}=await supabaseClient.auth.signInWithPassword({
    email:document.getElementById("email").value.trim(),
    password:document.getElementById("password").value
  });
  if(error){msg.className="error";msg.textContent="Connexion impossible : "+error.message;return;}
  await loadProfile();
}
async function logout(){await supabaseClient.auth.signOut();currentProfile=null;loginView();}

async function loadProfile(){
  const {data,error}=await supabaseClient.from("profiles").select("*").eq("id",(await supabaseClient.auth.getUser()).data.user.id).single();
  if(error){set("Profil introuvable. Vérifie que le compte existe dans Supabase et qu'il a bien une ligne dans profiles.","error");return;}
  currentProfile=data;
  currentProfile.role==="admin" ? adminHome() : poseurHome();
}

async function adminHome(){
  const {data:chantiers,error}=await supabaseClient.from("chantiers").select("*").order("created_at",{ascending:false});
  if(error){set("Erreur : "+esc(error.message),"error");return;}
  app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between">
    <div><span class="badge">ADMINISTRATEUR</span><h2>Mes chantiers</h2></div>
    <button class="btn secondary" onclick="logout()">Déconnexion</button>
  </div>
  <button class="btn" onclick="newChantier()">+ Nouveau chantier</button>
  <div id="list">${chantiers?.length?chantiers.map(c=>`<div class="item">
    <h3>${esc(c.nom)}</h3><p class="small">Créé le ${new Date(c.created_at).toLocaleDateString("fr-FR")}</p>
    <div class="row"><button class="btn" onclick="openChantier('${c.id}')">Ouvrir</button></div>
  </div>`).join(""):"<p class='small'>Aucun chantier créé.</p>"}</div></div>`;
}
async function newChantier(){
  const nom=prompt("Nom du chantier");
  if(!nom?.trim()) return;
  const user=(await supabaseClient.auth.getUser()).data.user;
  const {error}=await supabaseClient.from("chantiers").insert({nom:nom.trim(),created_by:user.id});
  if(error){alert(error.message);return;} adminHome();
}
async function openChantier(id){
  const {data:c}=await supabaseClient.from("chantiers").select("*").eq("id",id).single();
  const {data:l}=await supabaseClient.from("logements").select("*").eq("chantier_id",id).order("created_at");
  const {data:a}=await supabaseClient.from("chantier_poseurs").select("poseur_id, profiles(id,email,full_name)").eq("chantier_id",id);
  const {data:p}=await supabaseClient.from("profiles").select("id,email,full_name").eq("role","poseur").order("email");
  app.innerHTML=`<div class="card">
    <div class="row"><button class="btn secondary" onclick="adminHome()">← Retour</button><button class="btn secondary" onclick="logout()">Déconnexion</button></div>
    <h2>${esc(c.nom)}</h2>
    <h3>Logements</h3>
    ${l?.length?l.map(x=>`<div class="item"><b>${esc(x.nom||"Logement")}</b><p>${esc(x.adresse||"")}</p></div>`).join(""):"<p class='small'>Aucun logement pour le moment.</p>"}
    <hr><h3>Poseurs autorisés sur ce chantier</h3>
    <select id="poseurSelect" style="width:100%;padding:13px;border:1px solid #cbd5df;border-radius:10px;margin-bottom:10px">
      <option value="">Choisir un poseur</option>${p?.map(x=>`<option value="${x.id}">${esc(x.full_name||x.email)}</option>`).join("")}
    </select>
    <button class="btn" onclick="assignPoseur('${id}')">Ajouter le poseur</button>
    <div>${a?.length?a.map(x=>`<div class="item"><b>${esc(x.profiles?.full_name||x.profiles?.email||"Poseur")}</b></div>`).join(""):"<p class='small'>Aucun poseur affecté.</p>"}</div>
  </div>`;
}
async function assignPoseur(chantierId){
  const poseurId=document.getElementById("poseurSelect").value;
  if(!poseurId)return;
  const {error}=await supabaseClient.from("chantier_poseurs").insert({chantier_id:chantierId,poseur_id:poseurId});
  if(error && error.code!=="23505"){alert(error.message);return;}
  openChantier(chantierId);
}

async function poseurHome(){
  const {data:rows,error}=await supabaseClient.from("chantier_poseurs").select("chantier_id,chantiers(id,nom)");
  if(error){set("Erreur : "+esc(error.message),"error");return;}
  app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between">
    <div><span class="badge">POSEUR</span><h2>Mes chantiers</h2></div>
    <button class="btn secondary" onclick="logout()">Déconnexion</button>
  </div>
  ${rows?.length?rows.map(r=>`<div class="item"><h3>${esc(r.chantiers?.nom)}</h3><button class="btn" onclick="poseurChantier('${r.chantiers?.id}')">Ouvrir</button></div>`).join(""):"<p class='small'>Aucun chantier ne vous a été attribué.</p>"}</div>`;
}
async function poseurChantier(id){
  const {data:c}=await supabaseClient.from("chantiers").select("*").eq("id",id).single();
  const {data:l,error}=await supabaseClient.from("logements").select("*").eq("chantier_id",id).order("created_at");
  if(error){set("Erreur : "+esc(error.message),"error");return;}
  app.innerHTML=`<div class="card"><button class="btn secondary" onclick="poseurHome()">← Retour</button>
  <h2>${esc(c.nom)}</h2><h3>Logements</h3>
  ${l?.length?l.map(x=>`<div class="item"><h3>${esc(x.nom||"Logement")}</h3><p>${esc(x.adresse||"")}</p><button class="btn" onclick="openLogement('${x.id}')">Ouvrir</button></div>`).join(""):"<p class='small'>Aucun logement disponible.</p>"}
  </div>`;
}
async function openLogement(id){
  const {data:l}=await supabaseClient.from("logements").select("*").eq("id",id).single();
  app.innerHTML=`<div class="card"><button class="btn secondary" onclick="poseurChantier('${l.chantier_id}')">← Retour</button>
  <h2>${esc(l.nom||"Logement")}</h2><p>${esc(l.adresse||"")}</p>
  <hr><h3>Photos</h3>
  <p class="small">Le module photo sera activé à l'étape suivante. Ici, on valide d'abord les droits Administrateur / Poseur.</p></div>`;
}
init();
</script>
</body>
</html>

.status-badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef2f7;color:#334155}.status-done{background:#dcfce7;color:#166534}.status-todo{background:#fef3c7;color:#92400e}.validate-box{margin-top:16px;padding:14px;border:1px solid #dbe3ea;border-radius:12px;background:#f8fafc}.validate-box h3{margin-top:0}.done-note{font-size:13px;color:#166534;margin-top:8px}
.progress-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.progress-stats>div{border:1px solid #dce3e9;border-radius:14px;padding:14px;text-align:center;background:#f8fafc}.progress-stats b{display:block;font-size:28px}.progress-stats span{display:block;font-size:13px;color:#66727e;margin-top:4px}.filter-row{margin:12px 0}.filter-btn{flex:1;min-width:120px}@media(max-width:600px){.progress-stats{grid-template-columns:1fr 1fr}.progress-stats>div:first-child{grid-column:1/-1}}

<script>
/* REMPLACER CES DEUX VALEURS PAR CELLES DE TON PROJET SUPABASE */
const SUPABASE_URL = "https://vmhqbywplgahrxozroit.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_KQHZK6sX5B4OHDo7UYHu1Q_iKsKsSf2";

const app = document.getElementById("app");
let supabaseClient = null, currentProfile = null;

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function set(msg, cls=""){app.innerHTML=`<div class="card ${cls}">${msg}</div>`;}

function configOK(){
  return SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("A_REMPLACER") &&
         SUPABASE_PUBLISHABLE_KEY && !SUPABASE_PUBLISHABLE_KEY.includes("A_REMPLACER");
}

async function init(){
  if(!configOK()){
    set(`<h2>GLEN V2 — configuration</h2>
    <p>La base de données n'est pas encore connectée.</p>
    <p class="small">Après création du projet Supabase, remplace les deux valeurs indiquées dans le fichier index.html.</p>`);
    return;
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const {data:{session}} = await supabaseClient.auth.getSession();
  if(session) await loadProfile();
  else loginView();
}

function loginView(){
  app.innerHTML=`<div class="card">
    <h2>Connexion</h2>
    <label>Email</label><input id="email" type="email" autocomplete="username">
    <label>Mot de passe</label><input id="password" type="password" autocomplete="current-password">
    <button class="btn" onclick="login()">Se connecter</button>
    <div id="msg"></div>
  </div>`;
}
async function login(){
  const msg=document.getElementById("msg");
  msg.className="";
  const {error}=await supabaseClient.auth.signInWithPassword({
    email:document.getElementById("email").value.trim(),
    password:document.getElementById("password").value
  });
  if(error){msg.className="error";msg.textContent="Connexion impossible : "+error.message;return;}
  await loadProfile();
}
async function logout(){await supabaseClient.auth.signOut();currentProfile=null;loginView();}

async function loadProfile(){
  const {data,error}=await supabaseClient.from("profiles").select("*").eq("id",(await supabaseClient.auth.getUser()).data.user.id).single();
  if(error){set("Profil introuvable. Vérifie que le compte existe dans Supabase et qu'il a bien une ligne dans profiles.","error");return;}
  currentProfile=data;
  currentProfile.role==="admin" ? adminHome() : poseurHome();
}

async function adminHome(){
  const {data:chantiers,error}=await supabaseClient.from("chantiers").select("*").order("created_at",{ascending:false});
  if(error){set("Erreur : "+esc(error.message),"error");return;}
  const chantierIds=(chantiers||[]).map(c=>c.id);
  let logements=[];
  if(chantierIds.length){
    const {data:l,error:le}=await supabaseClient.from("logements").select("id,chantier_id,statut").in("chantier_id",chantierIds);
    if(le){set("Erreur : "+esc(le.message),"error");return;}
    logements=l||[];
  }
  const stats={};
  (chantiers||[]).forEach(c=>{stats[c.id]={total:0,done:0};});
  logements.forEach(l=>{if(!stats[l.chantier_id])stats[l.chantier_id]={total:0,done:0};stats[l.chantier_id].total++;if(l.statut==='Terminé')stats[l.chantier_id].done++;});
  const totalAll=logements.length, doneAll=logements.filter(x=>x.statut==='Terminé').length, todoAll=totalAll-doneAll;
  const pctAll=totalAll?Math.round(doneAll*100/totalAll):0;
  app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between">
    <div><span class="badge">ADMINISTRATEUR</span><h2>Mes chantiers</h2></div>
    <button class="btn secondary" onclick="logout()">Déconnexion</button>
  </div>
  <div class="progress-stats"><div><b>${(chantiers||[]).length}</b><span>🏗️ Chantiers</span></div><div><b>${totalAll}</b><span>🏠 Logements</span></div><div><b>${doneAll}</b><span>✅ Terminés</span></div><div><b>${todoAll}</b><span>⏳ À faire</span></div></div>
  <div class="item" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><b>Avancement global</b><b>${pctAll}%</b></div><div style="height:14px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px"><div style="height:100%;width:${pctAll}%;background:#16a34a;border-radius:999px"></div></div><p class="small">${doneAll} logement${doneAll>1?'s':''} terminé${doneAll>1?'s':''} sur ${totalAll}</p></div>
  <div class="row" style="margin-bottom:14px"><button class="btn" onclick="newChantier()">+ Nouveau chantier</button><button class="btn secondary" onclick="managePoseurs()">👷 Gérer les poseurs</button></div>
  <div id="list">${chantiers?.length?chantiers.map(c=>{const s=stats[c.id]||{total:0,done:0};const todo=s.total-s.done;const pct=s.total?Math.round(s.done*100/s.total):0;return `<div class="item">
    <div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">${esc(c.nom)}</h3><span class="status-badge ${pct===100&&s.total?'status-done':'status-todo'}">${pct===100&&s.total?'✅ Terminé':'⏳ En cours'}</span></div>
    <p class="small">Créé le ${new Date(c.created_at).toLocaleDateString("fr-FR")}</p>
    <div class="row" style="justify-content:space-between"><span>🏠 ${s.total} logements</span><span>✅ ${s.done} terminés</span><span>⏳ ${todo} à faire</span><b>${pct}%</b></div>
    <div style="height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:8px 0 12px"><div style="height:100%;width:${pct}%;background:#16a34a;border-radius:999px"></div></div>
    <div class="row"><button class="btn" onclick="openChantier('${c.id}')">Ouvrir le chantier</button></div>
  </div>`;}).join(""):"<p class='small'>Aucun chantier créé.</p>"}</div></div>`;
}
async function managePoseurs(){
  const {data:poseurs,error}=await supabaseClient.from('profiles').select('id,email,full_name,created_at').eq('role','poseur').order('email');
  if(error){alert(error.message);return;}
  app.innerHTML=`<div class="card">
    <div class="row"><button class="btn secondary" onclick="adminHome()">← Retour</button><button class="btn secondary" onclick="logout()">Déconnexion</button></div>
    <span class="badge">ADMINISTRATEUR</span>
    <h2>👷 Gestion des poseurs</h2>
    <p class="small">Crée ici les comptes poseurs. Le compte est confirmé automatiquement et pourra ensuite être affecté à un ou plusieurs chantiers.</p>
    <div class="item">
      <h3>➕ Nouveau poseur</h3>
      <label>Nom / prénom</label><input id="newPoseurName" type="text" placeholder="Ex. Damien Dumas" autocomplete="name">
      <label>Email</label><input id="newPoseurEmail" type="email" placeholder="poseur@glen.fr" autocomplete="email">
      <label>Mot de passe provisoire</label><input id="newPoseurPassword" type="password" placeholder="Minimum 8 caractères" autocomplete="new-password">
      <button class="btn" onclick="createPoseur()">➕ Créer le compte poseur</button>
      <div id="poseurCreateMsg"></div>
    </div>
    <div class="item">
      <h3>👷 Poseurs existants (${(poseurs||[]).length})</h3>
      ${(poseurs||[]).length ? (poseurs||[]).map(p=>`<div style="margin-top:10px;padding:12px;border:1px solid #dce3e9;border-radius:12px"><div style="font-weight:700">👷 ${esc(p.full_name||'Poseur')}</div><div class="small">${esc(p.email||'')}</div></div>`).join('') : '<p class="small">Aucun poseur pour le moment.</p>'}
    </div>
    <div class="item" style="background:#fff8e6"><b>🔐 Sécurité</b><p class="small">La création du compte passe par une fonction sécurisée Supabase. La clé secrète n'est jamais envoyée au navigateur.</p></div>
  </div>`;
}

async function createPoseur(){
  const msg=document.getElementById('poseurCreateMsg');
  const full_name=document.getElementById('newPoseurName').value.trim();
  const email=document.getElementById('newPoseurEmail').value.trim().toLowerCase();
  const password=document.getElementById('newPoseurPassword').value;
  if(!email){msg.className='error';msg.textContent='Indique l’email du poseur.';return;}
  if(password.length<8){msg.className='error';msg.textContent='Le mot de passe provisoire doit contenir au moins 8 caractères.';return;}
  msg.className='small';msg.textContent='Création du compte…';
  const {data,error}=await supabaseClient.functions.invoke('create-poseur',{body:{email, password, full_name}});
  if(error){msg.className='error';msg.textContent='Erreur : '+(error.message||error);return;}
  if(!data?.ok){msg.className='error';msg.textContent='Erreur : '+(data?.error||'Création impossible.');return;}
  msg.className='ok';msg.textContent='Poseur créé : '+email;
  document.getElementById('newPoseurName').value='';
  document.getElementById('newPoseurEmail').value='';
  document.getElementById('newPoseurPassword').value='';
  setTimeout(()=>managePoseurs(),700);
}

async function newChantier(){
  const nom=prompt("Nom du chantier");
  if(!nom?.trim()) return;
  const user=(await supabaseClient.auth.getUser()).data.user;
  const {error}=await supabaseClient.from("chantiers").insert({nom:nom.trim(),created_by:user.id});
  if(error){alert(error.message);return;} adminHome();
}
async function openChantier(id){
  const {data:c}=await supabaseClient.from("chantiers").select("*").eq("id",id).single();
  const {data:l}=await supabaseClient.from("logements").select("*").eq("chantier_id",id).order("created_at");
  const {data:a}=await supabaseClient.from("chantier_poseurs").select("poseur_id, profiles(id,email,full_name)").eq("chantier_id",id);
  const {data:p}=await supabaseClient.from("profiles").select("id,email,full_name").eq("role","poseur").order("email");
  const total=(l||[]).length, done=(l||[]).filter(x=>x.statut==='Terminé').length, todo=total-done;
  const poseurIds=[...(new Set((l||[]).map(x=>x.termine_par).filter(Boolean)))];
  let termineProfiles={};
  if(poseurIds.length){ const {data:tp}=await supabaseClient.from("profiles").select("id,email,full_name").in("id",poseurIds); (tp||[]).forEach(x=>termineProfiles[x.id]=x); }
  const logementHtml=(x)=>{ const pr=x.termine_par?termineProfiles[x.termine_par]:null; return `<div class="item logement-item" data-statut="${x.statut==='Terminé'?'termine':'afaire'}"><div class="row" style="justify-content:space-between;align-items:center"><b>${esc(x.nom||"Logement")}</b><span class="status-badge ${x.statut==='Terminé'?'status-done':'status-todo'}">${x.statut==='Terminé'?'✅ Terminé':'⏳ À faire'}</span></div><p>${esc(x.adresse||"")}</p><p class="small">${esc(x.code||"")} ${esc(x.commune||"")} ${x.num_bat?"• Bat "+esc(x.num_bat):""} ${x.num_log?"• Log "+esc(x.num_log):""} ${x.etage?"• Étage "+esc(x.etage):""}</p>${x.statut==='Terminé'?`<p class="done-note">✅ Terminé le ${x.termine_at?new Date(x.termine_at).toLocaleString('fr-FR'):''}${pr?` par ${esc(pr.full_name||pr.email)}`:''}</p>`:''}<div class="row"><button class="btn secondary" onclick="openLogement('${x.id}','admin')">📷 Photos / 📄 PDF</button><button class="btn" onclick="exportLogementDossier('${x.id}')">📦 Exporter le dossier</button>${x.statut==='Terminé'?`<button class="btn secondary" onclick="setLogementStatus('${x.id}','À faire')">↩️ Rouvrir</button>`:''}</div></div>`; };
  app.innerHTML=`<div class="card">
    <div class="row"><button class="btn secondary" onclick="adminHome()">← Retour</button><button class="btn secondary" onclick="logout()">Déconnexion</button><button class="btn" onclick="exportChantierDossier('${id}')">📦 Exporter le chantier</button></div>
    <h2>${esc(c.nom)}</h2>
    <div class="progress-stats"><div><b>${total}</b><span>Total logements</span></div><div><b>${todo}</b><span>⏳ À faire</span></div><div><b>${done}</b><span>✅ Terminés</span></div></div>
    <div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">Logements</h3><label class="btn" style="display:inline-block;text-align:center">📥 Importer Excel<input id="excelInput" type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="previewExcel('${id}',this.files[0])"></label></div>
    <div class="row filter-row"><button class="btn filter-btn" onclick="filterLogements('tous',this)">Tous (${total})</button><button class="btn secondary filter-btn" onclick="filterLogements('afaire',this)">⏳ À faire (${todo})</button><button class="btn secondary filter-btn" onclick="filterLogements('termine',this)">✅ Terminés (${done})</button></div>
    <p class="small">L'import se fait dans ce chantier. Les logements seront associés automatiquement à <b>${esc(c.nom)}</b>.</p>
    <div id="logementsList">${l?.length?l.map(logementHtml).join(""):"<p class='small'>Aucun logement pour le moment.</p>"}</div>
    <div id="importArea"></div>
    <hr><h3>👷 Gestion des poseurs</h3>
    <p class="small">Seuls les poseurs affectés peuvent accéder à ce chantier sur leur téléphone.</p>
    <div class="item"><b>Poseurs affectés</b>${a?.length?a.map(x=>`<div style="margin-top:12px;padding:12px;border:1px solid #dce3e9;border-radius:12px"><div style="font-weight:700">👷 ${esc(x.profiles?.full_name||x.profiles?.email||"Poseur")}</div>${x.profiles?.full_name?`<div class="small">${esc(x.profiles.email||"")}</div>`:""}<button class="btn danger" style="margin-top:10px;padding:9px 12px;font-size:14px" onclick="removePoseur('${id}','${x.poseur_id}')">❌ Retirer ce poseur</button></div>`).join(""):"<p class='small'>Aucun poseur affecté.</p>"}</div>
    <div class="item"><b>Ajouter un poseur</b><select id="poseurSelect" style="width:100%;padding:13px;border:1px solid #cbd5df;border-radius:10px;margin:10px 0"><option value="">Choisir un poseur</option>${p?.filter(x=>!(a||[]).some(y=>y.poseur_id===x.id)).map(x=>`<option value="${x.id}">${esc(x.full_name||x.email)}</option>`).join("")}</select><button class="btn" onclick="assignPoseur('${id}')">➕ Affecter le poseur</button></div>
  </div>`;
}
function filterLogements(filter,btn){
  document.querySelectorAll('.logement-item').forEach(el=>{el.style.display=(filter==='tous'||el.dataset.statut===filter)?'':'none';});
  document.querySelectorAll('.filter-btn').forEach(b=>{b.classList.add('secondary');});
  if(btn)btn.classList.remove('secondary');
}

async function assignPoseur(chantierId){
  const poseurId=document.getElementById("poseurSelect").value;
  if(!poseurId){alert("Choisis un poseur.");return;}
  const {error}=await supabaseClient.from("chantier_poseurs").insert({chantier_id:chantierId,poseur_id:poseurId});
  if(error && error.code!=="23505"){alert(error.message);return;}
  openChantier(chantierId);
}

async function removePoseur(chantierId,poseurId){
  if(!confirm("Retirer ce poseur de ce chantier ? Il ne pourra plus voir ce chantier sur son téléphone.")) return;
  const {error}=await supabaseClient.from("chantier_poseurs").delete().eq("chantier_id",chantierId).eq("poseur_id",poseurId);
  if(error){alert(error.message);return;}
  openChantier(chantierId);
}


function normHeader(v){return String(v??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");}
function mapHeaders(headers){
  const aliases={nom:["nom","nometprenom","nomlocataire","locataire"],adresse:["adresse","adresselogement"],code:["code","codepostal","cp"],commune:["commune","ville"],telephone:["telephone","tel","phone"],mail:["mail","email","courriel"],num_bat:["nbat","numbat","numerobatiment","batiment"],num_log:["nlog","numlog","numerologement","logement"],etage:["etage","niveau"],type:["type","typologie"]};
  const out={}; headers.forEach((h,i)=>{const n=normHeader(h); for(const [key,list] of Object.entries(aliases)){if(list.includes(n) && out[key]===undefined) out[key]=i;}}); return out;
}
async function previewExcel(chantierId,file){
  if(!file)return;
  const area=document.getElementById("importArea");
  area.innerHTML='<div class="item"><b>Lecture du fichier…</b></div>';

    const zip=new JSZip();

      const l=logements[n];
      const label=(l.num_log?`Logement ${l.num_log}`:(l.nom||`Logement ${n+1}`));

async function uploadPdf(logementId,file){
  if(!file)return;
  const msg=document.getElementById('pdfMsg');
  if(msg){msg.className='small';msg.textContent='Enregistrement du PDF…';}
  try{
    if(file.type!=='application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) throw new Error('Le fichier doit être un PDF.');
    const user=(await supabaseClient.auth.getUser()).data.user;
    const {data:old}=await supabaseClient.from('pdf_documents').select('*').eq('logement_id',logementId).maybeSingle();
    if(old){
      const {error:re}=await supabaseClient.storage.from('glen-documents').remove([old.storage_path]);
      if(re) throw re;
      const {error:de}=await supabaseClient.from('pdf_documents').delete().eq('id',old.id);
      if(de) throw de;
    }
    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const path=`${logementId}/${safeName}`;
    const {error:ue}=await supabaseClient.storage.from('glen-documents').upload(path,file,{contentType:'application/pdf',upsert:false});
    if(ue)throw ue;
    const {error:ie}=await supabaseClient.from('pdf_documents').insert({logement_id:logementId,original_filename:file.name,storage_path:path,uploaded_by:user.id});
    if(ie){await supabaseClient.storage.from('glen-documents').remove([path]);throw ie;}
    if(msg){msg.className='ok';msg.textContent='PDF enregistré.';}
    await openLogement(logementId,'admin');
  }catch(e){if(msg){msg.className='error';msg.textContent='Erreur : '+e.message;}}
}
let signatureCanvas=null, signatureCtx=null, signatureDrawing=false, signatureLast=null, signaturePdfId=null, signatureLogementId=null, signatureRole=null;
function openSignature(pdfId,logementId,role='entreprise'){
  signaturePdfId=pdfId; signatureLogementId=logementId; signatureRole=role;
  const labels={entreprise:'Entreprise',gestionnaire:'Gestionnaire',locataire:'Locataire'};
  const label=labels[role]||'Entreprise';
  document.body.insertAdjacentHTML('beforeend',`<div id="sigModal" class="modal-backdrop"><div class="modal"><h2>✍️ Signature ${label}</h2><p class="sig-note">Signez dans la zone ci-dessous avec la souris ou le doigt. La signature sera placée dans la case « ${label} » du PDF original.</p><div class="sig-wrap"><canvas id="signatureCanvas"></canvas></div><div class="modal-actions"><button class="btn secondary" onclick="clearSignature()">Effacer</button><button class="btn secondary" onclick="closeSignature()">Annuler</button><button class="btn" onclick="applySignature()">Valider la signature</button></div><div id="sigMsg"></div></div></div>`);
  signatureCanvas=document.getElementById('signatureCanvas'); signatureCtx=signatureCanvas.getContext('2d'); resizeSignatureCanvas();
  window.addEventListener('resize',resizeSignatureCanvas,{once:true});
  signatureCanvas.addEventListener('pointerdown',sigStart); signatureCanvas.addEventListener('pointermove',sigMove); signatureCanvas.addEventListener('pointerup',sigEnd); signatureCanvas.addEventListener('pointercancel',sigEnd); signatureCanvas.addEventListener('pointerleave',sigEnd);
  clearSignature();
}
function resizeSignatureCanvas(){if(!signatureCanvas)return;const r=signatureCanvas.getBoundingClientRect(),d=Math.max(1,window.devicePixelRatio||1);signatureCanvas.width=Math.round(r.width*d);signatureCanvas.height=Math.round(220*d);signatureCtx.setTransform(d,0,0,d,0,0);signatureCtx.lineWidth=2.2;signatureCtx.lineCap='round';signatureCtx.lineJoin='round';signatureCtx.strokeStyle='#111';}
function sigPoint(e){const r=signatureCanvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function sigStart(e){signatureDrawing=true;signatureLast=sigPoint(e);signatureCanvas.setPointerCapture?.(e.pointerId);signatureCtx.beginPath();signatureCtx.moveTo(signatureLast.x,signatureLast.y);}
function sigMove(e){if(!signatureDrawing)return;const p=sigPoint(e);signatureCtx.lineTo(p.x,p.y);signatureCtx.stroke();signatureLast=p;}
function sigEnd(){signatureDrawing=false;signatureLast=null;}
function clearSignature(){if(!signatureCanvas)return;signatureCtx.clearRect(0,0,signatureCanvas.width/(window.devicePixelRatio||1),signatureCanvas.height/(window.devicePixelRatio||1));}
function closeSignature(){document.getElementById('sigModal')?.remove();signatureCanvas=null;signatureCtx=null;signaturePdfId=null;signatureLogementId=null;signatureRole=null;}
async function applySignature(){
  const msg=document.getElementById('sigMsg'); if(!signatureCanvas||!signaturePdfId)return;
  const labels={entreprise:'Entreprise',gestionnaire:'Gestionnaire',locataire:'Locataire'};
  const label=labels[signatureRole]||'Entreprise';
  const hasInk=signatureCanvas.getContext('2d').getImageData(0,0,signatureCanvas.width,signatureCanvas.height).data.some((v,i)=>i%4===3&&v>0);
  if(!hasInk){msg.className='error';msg.textContent='Veuillez signer avant de valider.';return;}
  msg.className='small';msg.textContent='Préparation du PDF signé…';
  try{
    const {data:pdf,error}=await supabaseClient.from('pdf_documents').select('*').eq('id',signaturePdfId).single(); if(error||!pdf)throw error||new Error('PDF introuvable.');
    const {data:urlData,error:se}=await supabaseClient.storage.from('glen-documents').createSignedUrl(pdf.storage_path,3600); if(se)throw se;
    const response=await fetch(urlData.signedUrl); if(!response.ok)throw new Error('Impossible de lire le PDF original.');
    const bytes=await response.arrayBuffer();
    const doc=await PDFLib.PDFDocument.load(bytes,{updateFieldAppearances:false});
    const page=doc.getPages()[0];
    const png=await doc.embedPng(signatureCanvas.toDataURL('image/png'));
    const boxes={
      locataire:{x:52,y:36,width:200,height:68},
      gestionnaire:{x:257,y:36,width:90,height:68},
      entreprise:{x:350,y:36,width:175,height:68}
    };
    page.drawImage(png,{...boxes[signatureRole]||boxes.entreprise,opacity:1});
    const signed=await doc.save({updateFieldAppearances:false});
    const signedPath=`${signatureLogementId}/signed-${Date.now()}-${pdf.original_filename.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const blob=new Blob([signed],{type:'application/pdf'});
    const {error:ue}=await supabaseClient.storage.from('glen-documents').upload(signedPath,blob,{contentType:'application/pdf',upsert:false}); if(ue)throw ue;
    const {error:up}=await supabaseClient.from('pdf_documents').update({storage_path:signedPath,updated_at:new Date().toISOString()}).eq('id',pdf.id); if(up){await supabaseClient.storage.from('glen-documents').remove([signedPath]);throw up;}
    await supabaseClient.storage.from('glen-documents').remove([pdf.storage_path]);
    msg.className='ok';msg.textContent=`Signature ${label} enregistrée dans le PDF.`;
    setTimeout(()=>{
      closeSignature();
      const notice=document.getElementById('notice');
      if(notice){notice.className='ok';notice.textContent=`✅ Signature ${label} enregistrée dans le PDF.`;}
    },700);
  }catch(e){msg.className='error';msg.textContent='Erreur : '+(e?.message||e);}
}

  "Check Box24":"Avis locataire – Propreté du logement – 1",
  "Check Box26":"Avis locataire – Propreté du logement – 2"
};
const HIDDEN_FIXED_FIELDS=new Set(["1","Numéro locataire","Text2","Text3","Text111","Numéro de téléphone","DateBox1","Check Box20","Check Box23","Check Box25","Check Box201","Check Box24","Check Box26","Check Box1","Check Box2","Check Box9","Check Box10","Check Box8","Check Box4","Check Box6","Check Box7","Check Box11","Check Box12","Check Box13","Check Box3","Check Box14","Check Box5"]);

let fillPdfId=null, fillLogementId=null, fillDoc=null, fillForm=null;
async function openFillPdf(pdfId,logementId){
  fillPdfId=pdfId; fillLogementId=logementId;
  document.body.insertAdjacentHTML('beforeend',`<div id="fillModal" class="modal-backdrop"><div class="modal" style="max-height:92vh;overflow:auto"><h2>✏️ Remplir le PDF <small style="font-size:12px;font-weight:600;opacity:.55">V8.3</small></h2><p class="sig-note">Les champs sont présentés avec leur utilité pour éviter les noms techniques du PDF. La mise en page du PDF original et les signatures déjà enregistrées sont conservées.</p><div id="fillMsg" class="small">Chargement des champs…</div><div id="fillFields"></div><div class="modal-actions"><button class="btn secondary" onclick="closeFillPdf()">Annuler</button><button class="btn" onclick="saveFilledPdf()">💾 Enregistrer le PDF</button></div></div></div>`);
  try{
    const {data:pdf,error}=await supabaseClient.from('pdf_documents').select('*').eq('id',pdfId).single();
    if(error||!pdf)throw error||new Error('PDF introuvable.');
    const {data:urlData,error:se}=await supabaseClient.storage.from('glen-documents').createSignedUrl(pdf.storage_path,3600);
    if(se)throw se;
    const response=await fetch(urlData.signedUrl); if(!response.ok)throw new Error('Impossible de lire le PDF.');
    const bytes=await response.arrayBuffer();
    fillDoc=await PDFLib.PDFDocument.load(bytes,{updateFieldAppearances:false});
    fillForm=fillDoc.getForm();
    const fields=fillForm.getFields();
    const wrap=document.getElementById('fillFields');
    if(!fields.length){wrap.innerHTML='<p class="small">Aucun champ modifiable détecté dans ce PDF.</p>';document.getElementById('fillMsg').textContent='';return;}
    wrap.innerHTML=fields.map((f,i)=>{
      const rawName=f.getName();
      if(HIDDEN_FIXED_FIELDS.has(rawName)) return '';
      const name=esc(rawName);
      const rawLabel=FIELD_LABELS[rawName]||rawName;
      const label=esc(rawLabel);

      // Toute rubrique commençant par « Nombre » est une quantité :
      // on l'affiche systématiquement avec un menu 1 à 10.
      const isQuantity=/^Nombre\b/i.test(String(rawLabel).trim()) || /^Nombre\b/i.test(String(rawName).trim());
      if(isQuantity){
        let current='';
        try{
          current=(f.getSelected?.()[0]||f.getText?.()||'').toString().trim();
        }catch(e){}
        const opts=Array.from({length:10},(_,n)=>String(n+1));
        const selected=opts.includes(current)?current:'';
        return `<label class="fill-field quantity-field"><span>${label}</span><select data-fill-name="${name}" data-fill-type="dropdown"><option value="0">0</option>${opts.map(o=>`<option value="${o}" ${o===selected?'selected':''}>${o}</option>`).join('')}</select></label>`;
      }

      const type=f.constructor.name;
      if(type==='PDFCheckBox') return `<label class="fill-field checkbox-field"><input type="checkbox" data-fill-name="${name}" data-fill-type="checkbox" ${f.isChecked()?'checked':''}><span>${label}</span></label>`;
      if(type==='PDFDropdown' || type==='PDFOptionList' || typeof f.getOptions==='function'){
        const current=(f.getSelected?.()[0]||'');
        let opts=[]; try{opts=f.getOptions();}catch(e){}
        return `<label class="fill-field"><span>${label}</span><select data-fill-name="${name}" data-fill-type="dropdown"><option value="0">0</option>${opts.map(o=>`<option value="${esc(o)}" ${o===current?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
      }
      let val=''; try{val=f.getText?.()||'';}catch(e){}
      if(rawName==='DateBox2'){
        return `<label class="fill-field"><span>${label}</span><input type="date" data-fill-name="${name}" data-fill-type="date" value="${esc(val)}"></label>`;
      }
      return `<label class="fill-field"><span>${label}</span><input type="text" data-fill-name="${name}" data-fill-type="text" value="${esc(val)}"></label>`;
    }).join('');
    const workChecks=document.createElement('div');
    workChecks.className='work-checks';
    workChecks.innerHTML=`<h3>Contrôles et travaux</h3><label class="simple-check"><input type="checkbox" data-fill-name="Check Box1" data-fill-type="checkbox"><span>Mesure d’isolement</span></label><label class="simple-check"><input type="checkbox" data-fill-name="Check Box2" data-fill-type="checkbox"><span>Contrôle des dispositifs de protection</span></label><label class="simple-check"><input type="checkbox" data-fill-name="Check Box9" data-fill-type="checkbox"><span>Remplacement des panneaux solaires</span></label><label class="simple-check"><input type="checkbox" data-fill-name="Check Box10" data-fill-type="checkbox"><span>Mise en service des équipements solaires</span></label><label class="simple-check"><input type="checkbox" data-fill-name="Check Box8" data-fill-type="checkbox"><span>Carottage + pose de ventouse</span></label><label class="simple-check"><input type="checkbox" data-fill-name="Check Box4" data-fill-type="checkbox"><span>Essais de fonctionnement</span></label><label class="simple-check"><input type="checkbox" data-fill-name="Check Box6" data-fill-type="checkbox"><span>Remplacement de la vidange du ballon</span></label><label class="simple-check"><input type="checkbox" data-fill-name="Check Box7" data-fill-type="checkbox"><span>Remplacement / pose d’un réducteur de pression</span></label><label class="simple-check"><input type="checkbox" data-fill-name="Check Box11" data-fill-type="checkbox"><span>Mise en service des caissons</span></label><label class="simple-check"><input type="checkbox" data-fill-name="Check Box12" data-fill-type="checkbox"><span>Création de trappes de ramonage</span></label><label class="simple-check"><input type="checkbox" data-fill-name="Check Box13" data-fill-type="checkbox"><span>Ramonage des conduits de liaisons</span></label><label class="simple-check"><input type="checkbox" data-fill-name="Check Box3" data-fill-type="checkbox"><span>Contrôle de la résistance à la terre</span></label><label class="simple-check"><input type="checkbox" data-fill-name="Check Box14" data-fill-type="checkbox"><span>Ramonage des gaines</span></label><label class="simple-check"><input type="checkbox" data-fill-name="Check Box5" data-fill-type="checkbox"><span>Remplacement du groupe de sécurité</span></label>`;
    wrap.appendChild(workChecks);

    document.getElementById('fillMsg').textContent=`${fields.length} champs détectés.`;
  }catch(e){
    const m=document.getElementById('fillMsg'); if(m){m.className='error';m.textContent='Erreur : '+(e?.message||e);}
  }
}
function closeFillPdf(){document.getElementById('fillModal')?.remove();fillPdfId=null;fillLogementId=null;fillDoc=null;fillForm=null;}
async function saveFilledPdf(){
  const msg=document.getElementById('fillMsg'); if(!fillForm||!fillPdfId)return;

  // Ouvre une fenêtre immédiatement au clic pour éviter le blocage des pop-up
  // lorsque le PDF sera disponible après l'enregistrement.
  let pdfWindow=null;
  try{ pdfWindow=window.open('about:blank','_blank'); }catch(e){}

  msg.className='small';msg.textContent='Enregistrement du PDF…';
  try{
    document.querySelectorAll('#fillFields [data-fill-name]').forEach(el=>{
      const name=el.getAttribute('data-fill-name'), type=el.getAttribute('data-fill-type');
      const f=fillForm.getField(name);
      if(type==='checkbox'){
        if(el.checked) f.check(); else f.uncheck();
      }else if(type==='dropdown'){
        const v=el.value; if(v) f.select(v); else { try{f.setSelected([])}catch(e){} }
      }else if(type==='date'){
        const v=el.value||'';
        if(v){
          const [yy,mm,dd]=v.split('-');
          try{f.setText(`${dd}/${mm}/${yy}`);}catch(e){f.setText(v);}
        }else f.setText('');
      }else f.setText(el.value||'');
    });

    // Conserve les champs du PDF original et les signatures déjà présentes.
    const saved=await fillDoc.save({updateFieldAppearances:true});
    const {data:pdf,error}=await supabaseClient.from('pdf_documents').select('*').eq('id',fillPdfId).single();
    if(error||!pdf)throw error||new Error('PDF introuvable.');

    const path=`${fillLogementId}/filled-${Date.now()}-${pdf.original_filename.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const blob=new Blob([saved],{type:'application/pdf'});
    const {error:ue}=await supabaseClient.storage.from('glen-documents').upload(path,blob,{contentType:'application/pdf',upsert:false});
    if(ue)throw ue;

    const {error:up}=await supabaseClient.from('pdf_documents').update({storage_path:path,updated_at:new Date().toISOString()}).eq('id',pdf.id);
    if(up){
      await supabaseClient.storage.from('glen-documents').remove([path]);
      throw up;
    }

    await supabaseClient.storage.from('glen-documents').remove([pdf.storage_path]);

    // Génère le lien du PDF nouvellement enregistré puis l'ouvre automatiquement.
    const {data:urlData,error:se}=await supabaseClient.storage.from('glen-documents').createSignedUrl(path,3600);
    if(se||!urlData?.signedUrl)throw se||new Error('Impossible d’ouvrir le PDF enregistré.');

    msg.className='ok';
    msg.textContent='PDF enregistré. Ouverture du PDF…';

    if(pdfWindow && !pdfWindow.closed){
      pdfWindow.location.href=urlData.signedUrl;
    }else{
      // Secours si le navigateur a bloqué la nouvelle fenêtre.
      const a=document.createElement('a');
      a.href=urlData.signedUrl;
      a.target='_blank';
      a.rel='noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    setTimeout(()=>{closeFillPdf();},700);
  }catch(e){
    if(pdfWindow && !pdfWindow.closed) pdfWindow.close();
    msg.className='error';
    msg.textContent='Erreur : '+(e?.message||e);
  }
}
async function openPdf(pdfId){
  const {data:pdf,error}=await supabaseClient.from('pdf_documents').select('*').eq('id',pdfId).single();
  if(error||!pdf){alert('PDF introuvable.');return;}
  const {data,error:se}=await supabaseClient.storage.from('glen-documents').createSignedUrl(pdf.storage_path,3600);
  if(se){alert(se.message);return;}
  window.open(data.signedUrl,'_blank','noopener');
}
async function deletePdf(pdfId,path,logementId){
  if(!confirm('Supprimer le PDF de ce logement ?'))return;
  const {error:se}=await supabaseClient.storage.from('glen-documents').remove([path]);
  if(se){alert(se.message);return;}
  const {error:de}=await supabaseClient.from('pdf_documents').delete().eq('id',pdfId);
  if(de){alert(de.message);return;}
  await openLogement(logementId,'admin');
}

function renderPhotos(photos,mode){
  if(!photos.length)return '<p class="small">Aucune photo pour le moment.</p>';
  return photos.map(p=>`<div class="photo-card"><img src="${esc(p.public_url)}" alt="Photo logement"><div class="small">${new Date(p.created_at).toLocaleString('fr-FR')}</div>${mode==='poseur'?`<button class="btn danger" style="width:100%;padding:9px 12px;font-size:14px" onclick="deletePhoto('${p.id}','${esc(p.storage_path)}','${p.logement_id}')">Supprimer</button>`:''}</div>`).join('');
}
async function uploadPhoto(logementId,file){
  if(!file)return;
  await uploadPhotos(logementId,[file]);
}
async function uploadPhotos(logementId,files){
  const msg=document.getElementById('photoMsg');
  if(!files||!files.length)return;
  if(msg)msg.className='small'; if(msg)msg.textContent='Préparation de la photo…';
  try{
    const user=(await supabaseClient.auth.getUser()).data.user;
    for(const file of Array.from(files)){
      const blob=await compressImage(file);
      const path=`${logementId}/${user.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
      const {error:ue}=await supabaseClient.storage.from('glen-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});
      if(ue)throw ue;
      const {data:urlData}=supabaseClient.storage.from('glen-photos').getPublicUrl(path);
      const {error:ie}=await supabaseClient.from('photos').insert({logement_id:logementId,storage_path:path,public_url:urlData.publicUrl,user_id:user.id});
      if(ie){await supabaseClient.storage.from('glen-photos').remove([path]);throw ie;}
    }
    if(msg){msg.className='ok';msg.textContent='Photo(s) enregistrée(s).';}
    await openLogement(logementId,'poseur');
  }catch(e){if(msg){msg.className='error';msg.textContent='Erreur : '+e.message;}}
}
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(url);const max=1600;let w=img.naturalWidth,h=img.naturalHeight;if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);c.toBlob(b=>b?resolve(b):reject(new Error('Compression impossible')),'image/jpeg',0.82);};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Image illisible'));};img.src=url;
  });
}
async function deletePhoto(photoId,path,logementId){
  if(!confirm('Supprimer cette photo ?'))return;
  const {error:se}=await supabaseClient.storage.from('glen-photos').remove([path]);
  if(se){alert(se.message);return;}
  const {error:de}=await supabaseClient.from('photos').delete().eq('id',photoId);
  if(de){alert(de.message);return;}
  await openLogement(logementId,'poseur');
}
